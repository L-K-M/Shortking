# CD: tag-triggered release. scripts/release.sh bumps CFBundleShortVersionString
# (and auto-increments CFBundleVersion) in Resources/Info.plist, commits, tags
# vX.Y.Z, and with --push pushes branch + tag — the tag push lands here, which:
#
#   - re-proves the tagged commit (a v* tag can land on any commit, including one
#     CI never saw; a tag on a broken commit must not publish)
#   - asserts the tag matches the committed CFBundleShortVersionString — `make app`
#     copies Resources/Info.plist verbatim, so a mismatched tag would ship a
#     release named v1.3.0 containing a 0.1.0 bundle
#   - takes the Developer ID path when the signing secrets are configured: signs
#     with the hardened runtime, notarizes, staples, and verifies the result the
#     way a user's machine will
#   - falls back to an ad-hoc signed, unsigned-for-Gatekeeper build when they are
#     not, the same as Top Drawer and Zap, so the release channel works before any
#     certificate exists. The release notes say which of the two it was.
#   - publishes the .dmg and .zip with a SHA-256 sum for each, either way
#
# Shortking cannot ship on the Mac App Store (per-pid event taps are unsupported
# under App Sandbox, and it reads other apps' preference domains), so Developer ID
# + notarization is the distribution channel to aim for: an app that asks for
# Accessibility and Input Monitoring is a poor candidate for a Gatekeeper warning.
# Configure the secrets in the Secrets table in CICD.md and every subsequent tag
# upgrades itself to the signed path with no workflow change.
#
# Signing and packaging are driven through the Makefile (`make notarize` →
# dmg → app → sign) so the published artifact is assembled by exactly the same
# path a maintainer uses locally.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the artifacts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Shortking
  KEYCHAIN_PROFILE: shortking-notary

jobs:
  release:
    name: Build & publish
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # All seven secrets → Developer ID. None → ad-hoc fallback. *Some* is
      # neither: it is a half-finished configuration, and silently shipping an
      # unsigned build because one secret was misspelled is exactly the failure
      # this step exists to catch.
      - name: Resolve the signing path
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          present=()
          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            AC_API_KEY_BASE64 \
            AC_API_KEY_ID \
            AC_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            else
              present+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All Developer ID secrets present — signing and notarizing."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${#present[@]}" -eq 0 ]; then
            echo "::warning::No Developer ID secrets configured; publishing an ad-hoc signed, un-notarized build. Gatekeeper will warn on first launch. See CICD.md to configure signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release signing is partially configured; missing secrets: ${missing[*]}. Set all seven to sign, or none to publish an ad-hoc build."
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2" # keep in step with ci.yml

      - name: Match tag to committed CFBundleShortVersionString
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${COMMITTED} in Resources/Info.plist — cut releases with scripts/release.sh so they stay in step."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test the tagged commit
        run: swift test

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/shortking-signing.keychain-db"
          P12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$P12"' EXIT

          # Tolerate wrapped/whitespace-contaminated pastes (76-column base64, CRs,
          # copy artifacts) — only genuinely invalid base64 still fails.
          if ! printf '%s' "$DEVELOPER_ID_P12_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$P12" 2>/dev/null \
             || [ ! -s "$P12" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not valid base64 even after stripping whitespace."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$DEVELOPER_ID_P12_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Append to the search list rather than replacing it: notarytool stores its
          # credentials in the default (login) keychain, which must stay reachable.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # codesign accepts the SHA-1 of the identity, so the certificate's common
          # name doesn't have to be carried as a separate secret.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate. Ad-hoc or Apple Development certificates cannot be notarized."
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.signing.outputs.signed == 'true'
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          if ! printf '%s' "$AC_API_KEY_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEY" 2>/dev/null \
             || [ ! -s "$KEY" ]; then
            echo "::error::AC_API_KEY_BASE64 is not valid base64 even after stripping whitespace."
            exit 1
          fi
          # Stored in the default keychain, which is where `make notarize` (and its
          # bare --keychain-profile) looks for it.
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --key "$KEY" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID"

      # One target does the lot: notarize → dmg → app → sign. `make app` signs the
      # probe helper and the bundle with the hardened runtime, a secure timestamp and
      # Resources/Shortking.entitlements; `make notarize` then submits the DMG and
      # staples the ticket to both the DMG and the .app.
      - name: Build, sign, notarize & staple
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          make notarize \
            SIGN_IDENTITY="$SIGN_IDENTITY" \
            TEAM_ID="$APPLE_TEAM_ID" \
            KEYCHAIN_PROFILE="$KEYCHAIN_PROFILE"

      # Same Makefile path minus notarization. With SIGN_IDENTITY unset the `sign`
      # target ad-hoc signs (identity "-"), which carries no trust but IS required
      # for the bundle to launch at all on Apple Silicon.
      - name: Build & ad-hoc sign
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          make dmg

      - name: Verify the notarized bundle
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APP="build/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Confirms the hardened runtime and the secure timestamp actually landed —
          # notarization silently requires both, and a missing one only shows up as a
          # Gatekeeper rejection on a user's machine.
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E 'flags=.*runtime' \
            || { echo "::error::the signed bundle does not have the hardened runtime enabled"; exit 1; }
          xcrun stapler validate "$APP"
          xcrun stapler validate "build/$APP_NAME.dmg"
          # The real end-user check: Gatekeeper's own verdict on the stapled bundle.
          spctl --assess --type exec --verbose=4 "$APP"

      # An ad-hoc signature can't be assessed by Gatekeeper or stapled, but it can
      # still be verified for internal consistency — which is what catches a bundle
      # whose helper was staged after signing.
      - name: Verify the ad-hoc signed bundle
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "build/$APP_NAME.app"

      - name: Package & checksum
        id: package
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          DMG="$DIST/$APP_NAME-$VERSION.dmg"
          ZIP="$DIST/$APP_NAME-$VERSION.zip"
          cp "build/$APP_NAME.dmg" "$DMG"
          # ditto, not zip: it is the only archiver that preserves the bundle's
          # symlinks, resource forks and extended attributes, and therefore its
          # signature and stapled ticket.
          ditto -c -k --keepParent "build/$APP_NAME.app" "$ZIP"
          ( cd "$DIST" && shasum -a 256 ./*.dmg ./*.zip > "$APP_NAME-$VERSION.sha256" )
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

          # The release notes have to tell the truth about which path ran, because
          # the two need completely different things from the person downloading.
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ "$SIGNED" = "true" ]; then
            cat > "$NOTES" <<EOF
          ### Signed and notarized

          This build is signed with a Developer ID certificate and notarized by
          Apple, so it opens without a Gatekeeper prompt.
          EOF
          else
            cat > "$NOTES" <<EOF
          ### Unsigned build

          This build is **not** signed with a Developer ID or notarized, so macOS
          Gatekeeper will warn on first launch. To open it:

          - **Right-click** (or Control-click) the app → **Open** → **Open**, or
          - run \`xattr -dr com.apple.quarantine "/Applications/$APP_NAME.app"\`

          Grant Accessibility and Input Monitoring *after* moving the app to its
          final location: macOS keys those grants to the app's code signature and
          path, and moving it afterwards invalidates them.
          EOF
          fi
          cat >> "$NOTES" <<EOF

          Shortking needs **Accessibility** (to inventory menu bars) and, for
          Detective Mode's live capture, **Input Monitoring**. It is a read-only
          diagnostic: it never rebinds a shortcut, and the only system state it
          changes — the blackout test — is restored automatically.

          Verify the download against the published \`.sha256\` file:

          \`\`\`
          shasum -a 256 -c $APP_NAME-$VERSION.sha256
          \`\`\`
          EOF
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.dist }}/*.dmg
            ${{ steps.package.outputs.dist }}/*.zip
            ${{ steps.package.outputs.dist }}/*.sha256
          body_path: ${{ steps.package.outputs.notes }}

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
