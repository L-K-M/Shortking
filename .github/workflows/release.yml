# CD: tag-triggered release. scripts/release.sh bumps CFBundleShortVersionString
# (and auto-increments CFBundleVersion) in Resources/Info.plist, commits, tags
# vX.Y.Z, and with --push pushes branch + tag — the tag push lands here, which:
#
#   - re-proves the tagged commit (a v* tag can land on any commit, including one
#     CI never saw; a tag on a broken commit must not publish)
#   - asserts the tag matches the committed CFBundleShortVersionString — `make app`
#     copies Resources/Info.plist verbatim, so a mismatched tag would ship a
#     release named v1.3.0 containing a 0.1.0 bundle
#   - requires every Developer ID and notarization secret before building.
#     Shortking cannot ship on the Mac App Store (per-pid event taps are
#     unsupported under App Sandbox, and it reads other apps' preference
#     domains), so Developer ID + notarization is the only distribution channel
#     it has — and an unsigned build of a tool that asks for Accessibility and
#     Input Monitoring must never be published. Unlike Top Drawer and Zap, this
#     workflow has no ad-hoc fallback: missing secrets fail the release.
#   - signs with the hardened runtime, notarizes, staples, and publishes the
#     .dmg and .zip with a SHA-256 sum for each
#
# Signing and packaging are driven through the Makefile (`make notarize` →
# dmg → app → sign) so the published artifact is assembled by exactly the same
# path a maintainer uses locally.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the artifacts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Shortking
  KEYCHAIN_PROFILE: shortking-notary

jobs:
  release:
    name: Sign, notarize & publish
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Validate release signing configuration
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            AC_API_KEY_BASE64 \
            AC_API_KEY_ID \
            AC_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Release signing is not fully configured; missing secrets: ${missing[*]}. Shortking is never published unsigned — see CICD.md."
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2" # keep in step with ci.yml

      - name: Match tag to committed CFBundleShortVersionString
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${COMMITTED} in Resources/Info.plist — cut releases with scripts/release.sh so they stay in step."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test the tagged commit
        run: swift test

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/shortking-signing.keychain-db"
          P12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$P12"' EXIT

          # Tolerate wrapped/whitespace-contaminated pastes (76-column base64, CRs,
          # copy artifacts) — only genuinely invalid base64 still fails.
          if ! printf '%s' "$DEVELOPER_ID_P12_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$P12" 2>/dev/null \
             || [ ! -s "$P12" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not valid base64 even after stripping whitespace."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$DEVELOPER_ID_P12_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Append to the search list rather than replacing it: notarytool stores its
          # credentials in the default (login) keychain, which must stay reachable.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # codesign accepts the SHA-1 of the identity, so the certificate's common
          # name doesn't have to be carried as a separate secret.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate. Ad-hoc or Apple Development certificates cannot be notarized."
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          if ! printf '%s' "$AC_API_KEY_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEY" 2>/dev/null \
             || [ ! -s "$KEY" ]; then
            echo "::error::AC_API_KEY_BASE64 is not valid base64 even after stripping whitespace."
            exit 1
          fi
          # Stored in the default keychain, which is where `make notarize` (and its
          # bare --keychain-profile) looks for it.
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --key "$KEY" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID"

      # One target does the lot: notarize → dmg → app → sign. `make app` signs the
      # probe helper and the bundle with the hardened runtime, a secure timestamp and
      # Resources/Shortking.entitlements; `make notarize` then submits the DMG and
      # staples the ticket to both the DMG and the .app.
      - name: Build, sign, notarize & staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          make notarize \
            SIGN_IDENTITY="$SIGN_IDENTITY" \
            TEAM_ID="$APPLE_TEAM_ID" \
            KEYCHAIN_PROFILE="$KEYCHAIN_PROFILE"

      - name: Verify the notarized bundle
        run: |
          set -euo pipefail
          APP="build/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Confirms the hardened runtime and the secure timestamp actually landed —
          # notarization silently requires both, and a missing one only shows up as a
          # Gatekeeper rejection on a user's machine.
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E 'flags=.*runtime' \
            || { echo "::error::the signed bundle does not have the hardened runtime enabled"; exit 1; }
          xcrun stapler validate "$APP"
          xcrun stapler validate "build/$APP_NAME.dmg"
          # The real end-user check: Gatekeeper's own verdict on the stapled bundle.
          spctl --assess --type exec --verbose=4 "$APP"

      - name: Package & checksum
        id: package
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          DMG="$DIST/$APP_NAME-$VERSION.dmg"
          ZIP="$DIST/$APP_NAME-$VERSION.zip"
          cp "build/$APP_NAME.dmg" "$DMG"
          # ditto, not zip: it is the only archiver that preserves the bundle's
          # symlinks, resource forks and extended attributes, and therefore its
          # signature and stapled ticket.
          ditto -c -k --keepParent "build/$APP_NAME.app" "$ZIP"
          ( cd "$DIST" && shasum -a 256 ./*.dmg ./*.zip > "$APP_NAME-$VERSION.sha256" )
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.dist }}/*.dmg
            ${{ steps.package.outputs.dist }}/*.zip
            ${{ steps.package.outputs.dist }}/*.sha256
          body: |
            ### Signed and notarized

            This build is signed with a Developer ID certificate and notarized by
            Apple, so it opens without a Gatekeeper prompt.

            Shortking needs **Accessibility** (to inventory menu bars) and, for
            Detective Mode's live capture, **Input Monitoring**. It is a read-only
            diagnostic: it never rebinds a shortcut, and the only system state it
            changes — the blackout test — is restored automatically.

            Verify the download against the published `.sha256` file:

            ```
            shasum -a 256 -c ${{ env.APP_NAME }}-${{ env.VERSION }}.sha256
            ```

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
